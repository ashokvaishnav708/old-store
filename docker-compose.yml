services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oldstore
      POSTGRES_PASSWORD: oldstore
      POSTGRES_DB: oldstore
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oldstore']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oldstore
      MINIO_ROOT_PASSWORD: oldstore123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job that creates and public-exposes the listings bucket on startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 oldstore oldstore123 &&
      mc mb -p local/listings &&
      mc anonymous set download local/listings
      "

  # One-off job: applies pending Drizzle migrations, then exits.
  # `app` waits on this completing successfully before it starts.
  migrate:
    build:
      context: .
      target: build
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgres://oldstore:oldstore@postgres:5432/oldstore
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: seeds the category tree. Not run by default -- opt in with:
  #   docker compose --profile seed run --rm seed
  seed:
    build:
      context: .
      target: build
    command: npm run db:seed
    environment:
      DATABASE_URL: postgres://oldstore:oldstore@postgres:5432/oldstore
    profiles: ['seed']
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      target: runtime
      args:
        REDIS_URL: redis://redis:6379
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: postgres://oldstore:oldstore@postgres:5432/oldstore
      NUXT_REDIS_URL: redis://redis:6379
      NUXT_S3_ENDPOINT: http://minio:9000
      NUXT_S3_REGION: us-east-1
      NUXT_S3_BUCKET: listings
      NUXT_S3_ACCESS_KEY_ID: oldstore
      NUXT_S3_SECRET_ACCESS_KEY: oldstore123
      NUXT_S3_PUBLIC_URL: http://localhost:9000/listings
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD in your .env}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/categories']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  minio_data:
